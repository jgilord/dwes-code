services:
  web:
    build: .
    container_name: dwes_apache
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      - db


  db:
    image: mariadb:10.11
    container_name: dwes_mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - dwes_db:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: dwes_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - ./config/phpmyadmin/themes/boodark:/var/www/html/themes/boodark
    depends_on:
      - db

  filebrowser:
    image: filebrowser/filebrowser:latest
    container_name: dwes_filebrowser
    restart: unless-stopped
    user: "1001:1001"
    ports:
      - "8081:80"
    volumes:
      - ./ud2:/srv
      - ./config/filebrowser/filebrowser.db:/database/filebrowser.db
      - ./config/filebrowser/settings.json:/config/settings.json

volumes:
  dwes_db:
